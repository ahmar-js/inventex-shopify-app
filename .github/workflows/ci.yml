name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://inventex:inventex@localhost:5432/inventex?schema=public
      SHOPIFY_API_KEY: ci-test-key
      SHOPIFY_API_SECRET: ci-test-secret
      SHOPIFY_APP_URL: https://inventex.example.com
      SCOPES: read_products,write_products,read_inventory,read_publications,write_publications,read_locations,write_online_store_navigation
      CRON_SECRET: ci-test-cron-secret
      SUPPORT_EMAIL: support@inventex.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx prisma validate
      - run: npm run lint
      - run: npm run build
